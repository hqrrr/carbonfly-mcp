[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carbonfly-mcp"
version = "0.1.0"
description = "MCP server for Carbonfly – headless indoor CO2 CFD simulation with OpenFOAM via WSL"
authors = [{name = "Qirui Huang"}]
license = {text = "LGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/carbonfly_mcp"]

[project.scripts]
carbonfly-mcp = "carbonfly_mcp.server:main"
